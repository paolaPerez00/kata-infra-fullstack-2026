services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./kata-back-fullstack-2026
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # El executor escribe aquí; la ruta debe ser idéntica en host y contenedor
      TMPDIR: /tmp/kata-exec
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kata-exec:/tmp/kata-exec

  web:
    build: ./kata-front-fullstack-2026
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

  # docker compose --profile seed run --rm seed
  seed:
    build:
      context: ./kata-back-fullstack-2026
      target: build
    profiles: ["seed"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    command: ["npm", "run", "seed"]

volumes:
  pgdata: